name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Bump app version
      if: github.event_name == 'push'
      run: python3 scripts/bump_version.py

    - name: Commit version bump
      if: github.event_name == 'push'
      run: |
        if git diff --quiet -- version.properties; then
          exit 0
        fi

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add version.properties
        git commit -m "chore: bump app version [skip ci]"
        git push

    - name: Read version metadata
      id: version
      run: |
        VERSION_CODE=$(grep '^VERSION_CODE=' version.properties | cut -d= -f2)
        VERSION_NAME=$(grep '^VERSION_NAME=' version.properties | cut -d= -f2)
        echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
        echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        # cache: gradle # setup-gradle이 캐싱을 담당하므로 중복 방지

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5' # Gradle 8.5 강제 지정

    - name: Build artifacts with Gradle
      run: ./gradlew assembleDebug assembleRelease bundleRelease

    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-v${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk-v${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}
        path: app/build/outputs/apk/release/app-release-unsigned.apk

    - name: Upload release AAB
      uses: actions/upload-artifact@v4
      with:
        name: app-release-aab-v${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}
        path: app/build/outputs/bundle/release/app-release.aab
